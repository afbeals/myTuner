services:
  mytuner:
    image: afbeals/mytuner:${MYTUNER_VERSION:-0.2.0}
    container_name: mytuner
    init: true
    restart: unless-stopped
    user: "${MYTUNER_UID:-1000}:${MYTUNER_GID:-1000}"
    ports:
      - "${MYTUNER_PORT:-8777}:8777"
    environment:
      MYTUNER_COLLECTION_RETENTION_DAYS: "${MYTUNER_COLLECTION_RETENTION_DAYS:-7}"
      MYTUNER_REPORT_RETENTION_DAYS: "${MYTUNER_REPORT_RETENTION_DAYS:-30}"
      MYTUNER_ENCODER_CONCURRENCY: "${MYTUNER_ENCODER_CONCURRENCY:-3}"
      MYTUNER_SECURE_COOKIE: "${MYTUNER_SECURE_COOKIE:-false}"
      MYTUNER_PUBLIC_ORIGIN: "${MYTUNER_PUBLIC_ORIGIN:-}"
    volumes:
      - type: bind
        source: ${MYTUNER_DATA_PATH:?set MYTUNER_DATA_PATH}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${MYTUNER_GENERATED_PATH:?set MYTUNER_GENERATED_PATH}
        target: /generated
        bind:
          create_host_path: false
      - type: bind
        source: ${MYTUNER_CACHE_PATH:?set MYTUNER_CACHE_PATH}
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ${MYTUNER_MEDIA_PATH:?set MYTUNER_MEDIA_PATH}
        target: /media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MYTUNER_COMMERCIALS_PATH:?set MYTUNER_COMMERCIALS_PATH}
        target: /commercials
        read_only: true
        bind:
          create_host_path: false
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8777]/"
