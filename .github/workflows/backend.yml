name: myTuner checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  version:
    name: Release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check package version and PR version increase
        env:
          VERSION_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$VERSION_BASE" ]; then
            npm run docker:check -- --base "$VERSION_BASE"
          else
            npm run docker:check
          fi
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:smoke

  browser-tests:
    name: Browser shard ${{ matrix.shard }}/3
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure browser cache directory
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"
      - run: command -v ffmpeg || brew install ffmpeg
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('package-lock.json') }}
      - run: ./node_modules/.bin/playwright install chromium
      - run: npm run test:ui -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
  # Keep the existing required-check name. Missing/cancelled shards cannot pass.
  browser:
    runs-on: ubuntu-latest
    if: always()
    needs: browser-tests
    steps:
      - name: Require every browser shard
        env:
          SHARDS_RESULT: ${{ needs.browser-tests.result }}
        run: test "$SHARDS_RESULT" = success

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: mytuner-tv-poc-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  docker:
    name: Docker acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mytuner-build-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'package-lock.json') }}-
            ${{ runner.os }}-buildx-
      - run: npm run docker:build
        env:
          MYTUNER_BUILD_CACHE_FROM: type=local,src=${{ runner.temp }}/mytuner-build-cache
          MYTUNER_BUILD_CACHE_TO: type=local,dest=${{ runner.temp }}/mytuner-build-cache-next,mode=max
      - name: Retain the latest Docker layers
        run: |
          rm -rf "$RUNNER_TEMP/mytuner-build-cache"
          mv "$RUNNER_TEMP/mytuner-build-cache-next" "$RUNNER_TEMP/mytuner-build-cache"
      - run: npm run docker:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-acceptance
          path: artifacts/docker/
          if-no-files-found: ignore
